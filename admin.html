<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pena Máxima - Admin</title>
<style>body{margin:0;background:#06141b;color:#ccd0cf;font:16px system-ui,sans-serif;padding:18px}h1{color:#fff;font-size:22px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #4a5c6a;background:#11212d;color:#fff;margin:4px 0}button{background:#ff8a3d;color:#1b0e04;border:0;font-weight:700;cursor:pointer}.c{background:#11212d;border:1px solid #253745;border-radius:14px;padding:14px;margin:10px 0}.c b{color:#fff}.s{color:#9ba8ab;font-size:13px}#m{color:#ff6b5e}</style></head><body>
<h1>Pedidos de desbloqueio</h1><div id="lg"><input id="e" type="email" placeholder="Email admin"><br><input id="p" type="password" placeholder="Senha"><br><button id="in">Entrar</button><p id="m"></p></div><div id="ls"></div>
<script src="config.js"></script><script src="auth.js"></script><script>
const $=s=>document.querySelector(s);
$('#in').onclick=async()=>{try{if(!AUTH.live())throw Error('Falta a chave Firebase em config.js.');const u=await AUTH.login($('#e').value,$('#p').value);if((u.email||'').toLowerCase()!==CFG.admin.toLowerCase())throw Error('Esta conta não é de administrador.');$('#lg').hidden=true;load()}catch(e){$('#m').textContent=e.message}};
async function load(){const r=await DB.get('requests')||{};const L=$('#ls');L.innerHTML='';const a=Object.entries(r).filter(([k,v])=>v.status=='pending').sort((x,y)=>y[1].ts-x[1].ts);if(!a.length)L.textContent='Sem pedidos pendentes.';
for(const[k,v]of a){const d=document.createElement('div');d.className='c';d.innerHTML='<b></b><div class="s"></div>';d.firstChild.textContent=v.item+' - '+(v.amount||'')+' Kz';d.lastChild.textContent=v.email+' | '+v.method+' | ref '+v.ref+' | '+new Date(v.ts).toLocaleString('pt-PT');
const ok=document.createElement('button');ok.textContent='Aprovar (confirmei o pagamento)';ok.onclick=async()=>{ok.disabled=true;if(v.item=='world')await DB.patch('users/'+v.uid+'/ent',{world:true});else await DB.patch('users/'+v.uid+'/ent/items',{[v.item]:true});await DB.patch('requests/'+k,{status:'approved'});load()};
const no=document.createElement('button');no.textContent='Recusar';no.style.marginLeft='8px';no.style.background='#4a5c6a';no.style.color='#fff';no.onclick=async()=>{await DB.patch('requests/'+k,{status:'rejected'});load()};d.append(ok,no);L.appendChild(d)}}
</script></body></html>
