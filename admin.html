<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pena Máxima - Admin</title>
<style>body{margin:0;background:#06141b;color:#ccd0cf;font:16px system-ui,sans-serif;padding:18px}h1{color:#fff;font-size:22px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #4a5c6a;background:#11212d;color:#fff;margin:4px 0}button{background:#ff8a3d;color:#1b0e04;border:0;font-weight:700;cursor:pointer}.c{background:#11212d;border:1px solid #253745;border-radius:14px;padding:14px;margin:10px 0}.c b{color:#fff}.s{color:#9ba8ab;font-size:13px}#m{color:#ff6b5e}</style></head><body>
<h1>Pedidos de desbloqueio</h1><div id="lg"><input id="e" type="email" placeholder="Email admin"><br><input id="p" type="password" placeholder="Senha"><br><button id="in">Entrar</button><p id="m"></p></div><div id="rt" class="c" hidden><b>Câmbio (Kz por 1 $)</b><br><input id="rate" type="number" value="913"><button id="rs">Guardar câmbio</button><p class="s" id="rm"></p></div><div id="ad" class="c" hidden><b>Anúncios de parceiros</b><p class="s">Uma linha por anúncio: texto | link | texto do botão</p><textarea id="ads" rows="5" style="width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:1px solid #4a5c6a;background:#11212d;color:#fff"></textarea><button id="adsS">Guardar anúncios</button><p class="s" id="adsM"></p><hr style="border-color:#253745"><b>Promoção</b><br><input id="pp" type="number" placeholder="Desconto %" style="width:110px"> <input id="pd" type="number" placeholder="Dias" style="width:90px"><br><input id="pl" placeholder="Texto (ex: Semana do cliente)" style="width:100%;box-sizing:border-box"><br><button id="ppS">Ativar promoção</button> <button id="ppX" style="background:#4a5c6a;color:#fff">Terminar</button><p class="s" id="ppM"></p></div><div id="ls"></div>
<script src="config.js"></script><script src="auth.js"></script><script>
const $=s=>document.querySelector(s);
$('#in').onclick=async()=>{try{if(!AUTH.live())throw Error('Falta a chave Firebase em config.js.');const u=await AUTH.login($('#e').value,$('#p').value);if((u.email||'').toLowerCase()!==CFG.admin.toLowerCase())throw Error('Esta conta não é de administrador.');$('#lg').hidden=true;$('#rt').hidden=false;$('#ad').hidden=false;loadAds();try{const r=await DB.get('config/usdRate');if(r)$('#rate').value=r}catch(e){}load()}catch(e){$('#m').textContent=e.message}};
$('#rs').onclick=async()=>{try{const n=Number($('#rate').value);if(!(n>100&&n<5000))throw Error('Valor inválido');await DB.patch('config',{usdRate:n});$('#rm').textContent='Guardado: 1 $ = '+n+' Kz'}catch(e){$('#rm').textContent=e.message}};
async function loadAds(){try{const c=await DB.get('config')||{};const L=c.ads?Object.values(c.ads):[];$('#ads').value=L.map(x=>[x.t,x.u,x.c].join(' | ')).join('\n')}catch(e){}}
$('#adsS').onclick=async()=>{try{const L=$('#ads').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('|').map(y=>y.trim());return{t:p[0],u:p[1]||'',c:p[2]||'Ver'}});await DB.set('config/ads',L);$('#adsM').textContent='Guardado ('+L.length+' anúncios)'}catch(e){$('#adsM').textContent=e.message}};
$('#ppS').onclick=async()=>{try{const p=Number($('#pp').value),d=Number($('#pd').value);if(!(p>0&&p<=90&&d>0&&d<=60))throw Error('Desconto 1-90 % e dias 1-60');await DB.set('config/promo',{pct:p,until:Date.now()+d*864e5,label:$('#pl').value.slice(0,40)});$('#ppM').textContent='Promoção ativa por '+d+' dias'}catch(e){$('#ppM').textContent=e.message}};
$('#ppX').onclick=async()=>{try{await DB.set('config/promo',null);$('#ppM').textContent='Promoção terminada'}catch(e){$('#ppM').textContent=e.message}};
async function load(){const r=await DB.get('requests')||{};const L=$('#ls');L.innerHTML='';const a=Object.entries(r).filter(([k,v])=>v.status=='pending').sort((x,y)=>y[1].ts-x[1].ts);if(!a.length)L.textContent='Sem pedidos pendentes.';
for(const[k,v]of a){const d=document.createElement('div');d.className='c';d.innerHTML='<b></b><div class="s"></div>';d.firstChild.textContent=v.item+' - '+(v.usd?v.usd+' $ = ':'')+(v.amount||'')+' Kz';d.lastChild.textContent=v.email+' | '+v.method+' | ref '+v.ref+' | '+new Date(v.ts).toLocaleString('pt-PT');
const ok=document.createElement('button');ok.textContent='Aprovar (confirmei o pagamento)';ok.onclick=async()=>{ok.disabled=true;if(v.item=='world')await DB.patch('users/'+v.uid+'/ent',{world:true});else if(/^coin_/.test(v.item)){const n={coin_s:600,coin_m:1500,coin_l:4000}[v.item]||0;const c=await DB.get('users/'+v.uid+'/ent/coinsTotal');await DB.patch('users/'+v.uid+'/ent',{coinsTotal:(typeof c=='number'?c:0)+n})}else{const cur=await DB.get('users/'+v.uid+'/ent/items/'+v.item);const base=Math.max(Date.now(),typeof cur=='number'?cur:0);await DB.patch('users/'+v.uid+'/ent/items',{[v.item]:base+30*864e5})}await DB.patch('requests/'+k,{status:'approved'});load()};
const no=document.createElement('button');no.textContent='Recusar';no.style.marginLeft='8px';no.style.background='#4a5c6a';no.style.color='#fff';no.onclick=async()=>{await DB.patch('requests/'+k,{status:'rejected'});load()};d.append(ok,no);L.appendChild(d)}}
</script></body></html>
